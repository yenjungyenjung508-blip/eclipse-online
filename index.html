
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>永夜紀元｜ECLIPSE ONLINE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="logo" href="#home">✦ 永夜紀元</a>
    <nav>
      <a href="#lore">世界觀</a>
      <a href="#classes">職業介紹</a>
      <a href="#news">最新消息</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">
      <p class="eyebrow">THE AGE OF ETERNAL NIGHT</p>
      <h1>當太陽隕落，<br><span>傳說才剛開始。</span></h1>
      <p>踏入被黑暗吞噬的世界，決定王國的最終命運。</p>
      <a class="button" href="#lore">開始探索 ↗</a>
    </section>

    <section id="lore">
      <p class="eyebrow">THE PROPHECY</p>
      <h2>世界的盡頭，是誰的黎明？</h2>
      <p>古老的封印正在崩解，遠古巨龍再次甦醒。</p>
      <p>在艾瑟瑞亞大陸，寫下屬於你的傳奇。</p>
    </section>

    <section id="classes">
      <p class="eyebrow">CHOOSE YOUR FATE</p>
      <h2>選擇你的職業</h2>
      <div class="classes">
        <button data-class="騎士">聖殿騎士</button>
        <button data-class="刺客">暗影刺客</button>
        <button data-class="法師">符文法師</button>
      </div>
      <p id="class-description">選擇職業，開始你的冒險。</p>
    </section>

    <section id="news">
      <p class="eyebrow">CHRONICLES</p>
      <h2>王國最新紀事</h2>
      <article>
        <span>開發日誌</span>
        <h3>永夜紀元：世界初啟</h3>
        <p>更多遊戲資訊即將公開。</p>
      </article>
    </section>
  </main>

  <footer>© 2026 ECLIPSE ONLINE</footer>
  <script src="script.js"></script>
</body>
</html>
